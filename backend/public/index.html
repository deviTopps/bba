<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BBA Administration</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/login.css"><link rel="stylesheet" href="/compact.css"><link rel="stylesheet" href="/features.css"><link rel="stylesheet" href="/staff.css"><script defer src="/app.js"></script><script defer src="/features.js"></script></head><body class="login-view">
<aside><div class="brand"><img class="sidebar-logo" src="/sidebar-logo.jpeg" alt="Bernard Bempong & Associates" width="1050" height="313"></div><nav aria-label="Admin navigation"><button data-view="enquiries">Enquiries</button><button data-view="posts">Blog posts</button><button data-view="consultations">Consultations</button><button data-view="calendar">Calendar</button><button data-view="staff">Staff access</button><button data-view="activity">Activity history</button><button data-view="account">My account</button></nav></aside>
<main><header class="dashboard-header"><div class="dashboard-title"><h1 id="heading">Dashboard</h1></div><div class="dashboard-header-actions"><button class="header-account" id="header-account" type="button" aria-label="Open my account"><span id="account-avatar" class="account-avatar" aria-hidden="true">B</span><span class="account-copy"><span id="identity"></span><span id="account-role"></span></span></button><button id="logout" class="header-signout" hidden>Sign out</button></div></header><p id="message" role="status" aria-live="polite"></p>
<section id="login" aria-label="Admin sign-in">
  <div class="login-card">
    <img class="login-logo" src="/BBA.svg" width="250" height="75" alt="Bernard Bempong & Associates">
    <form id="loginForm"><label for="login-email">Email address<input id="login-email" name="email" type="email" autocomplete="username" placeholder="you@company.com" required></label><label for="login-password">Password</label><div class="password-wrap"><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button id="toggle-password" type="button" aria-label="Show password" aria-pressed="false">Show</button></div><p id="login-feedback" role="alert" aria-live="polite"></p><button class="primary login-submit" type="submit"><span>Sign in</span></button></form>
  </div>
</section>
<section id="workspace" hidden><div id="metrics" class="metrics"></div><div class="toolbar"><form id="searchForm"><input id="search" aria-label="Search records" placeholder="Search records…"><button>Search</button></form><button id="create" class="primary" hidden>Create post</button><button id="refresh">Refresh</button></div><div id="filters" class="toolbar"><select id="statusFilter" aria-label="Filter by status"><option value="">All statuses</option></select><label id="overdueLabel"><input id="overdue" type="checkbox"> Overdue follow-ups</label><button id="export">Export CSV</button></div><div id="records" class="panel"></div><div class="pagination" id="pagination"><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button></div></section>
<dialog id="editor"><form id="editForm"><div class="dialogHeader"><h2 id="editorTitle">Edit record</h2><button type="button" id="close">Close</button></div><div id="fields"></div><p id="editorMessage" role="alert"></p><div class="toolbar"><button class="primary">Save changes</button><button type="button" id="previewPost" hidden>Preview article</button><button type="button" id="delete" hidden>Delete post</button></div><div id="recordHistory"></div></form></dialog><dialog id="preview"><button id="closePreview" type="button">Close preview</button><article id="previewContent"></article></dialog></main></body></html>
